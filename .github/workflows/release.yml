name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME}" scripts/bundle.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent XMNative.app "XMNative-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "XMNative-${GITHUB_REF_NAME}.zip" > "XMNative-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/XMNative-${GITHUB_REF_NAME}.zip" \
            "build/XMNative-${GITHUB_REF_NAME}.zip.sha256" \
            --title "XMNative ${GITHUB_REF_NAME}" \
            --generate-notes
